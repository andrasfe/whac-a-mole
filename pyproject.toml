[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whacamole"
version = "1.0.0"
description = "Active window button watcher and auto-clicker for blue Agree buttons (configurable)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Whac-A-Mole Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: X11 Applications :: GTK",
]
dependencies = [
    "PyGObject>=3.40.0; sys_platform == 'linux'",
    "pyobjc-framework-ApplicationServices>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The GTK GUI on macOS additionally needs `brew install gtk+3 pygobject3`.
gui = ["PyGObject>=3.40.0"]

[project.scripts]
whacamole = "whacamole.cli:main"
